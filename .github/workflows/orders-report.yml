name: Orders report

# Read-only count of FenderU orders, for the daily sales check. Calls the
# site's /api/orders-summary endpoint with a key derived from the deploy
# token (deploy.mjs sets the same key on the Worker). Prints counts and dates
# only: no names, addresses, emails or phone numbers ever reach this log
# (the repository is public).

on:
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Query order counts
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "ORDERS_REPORT: no CLOUDFLARE_API_TOKEN"; exit 1; fi
          KEY=$(printf %s "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)
          echo "::add-mask::$KEY"
          R=$(curl -sS -w '\n%{http_code}' "https://fenderu.com/api/orders-summary?t=$(date +%s)" -H "X-Report-Key: $KEY")
          CODE=$(echo "$R" | tail -1); BODY=$(echo "$R" | sed '$d')
          if [ "$CODE" != "200" ]; then echo "ORDERS_REPORT: endpoint returned $CODE: $BODY"; exit 1; fi
          echo "ORDERS_REPORT: $(echo "$BODY" | jq -c '.summary')"
          echo "ORDERS_RECENT: $(echo "$BODY" | jq -c '.recent')"
          {
            echo "## FenderU orders (counts only)"
            echo '```'
            echo "$BODY" | jq -r '.summary | to_entries | map("\(.key): \(.value)") | .[]'
            echo
            echo "recent (id, day, quantity, payment_method):"
            echo "$BODY" | jq -r '.recent[] | "\(.id)  \(.day)  qty \(.quantity)  \(.payment_method)"'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
