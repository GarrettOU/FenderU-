name: Deploy fenderu Worker

on:
  push:
    branches: [main]
    paths: ["cfworker/**", ".github/workflows/deploy-worker.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node cfworker/build.mjs
      - run: node cfworker/deploy.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      - name: Verify live site
        run: |
          sleep 15
          html=$(curl -fsSL "https://fenderu.com/?v=$GITHUB_SHA")
          echo "$html" | grep -q "__fuWired" || { echo "checkout wiring missing on live page"; exit 1; }
          echo "$html" | grep -q '\$119' || { echo "\$119 price missing"; exit 1; }
          curl -fsS -o /dev/null -w "img %{http_code}\n" https://fenderu.com/og-image.jpg
          echo "live site OK"
